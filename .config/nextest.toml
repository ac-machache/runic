[test-groups]
pg-global-queue = { max-threads = 1 }

[profile.default]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
retries = 0
slow-timeout = { period = "45s", terminate-after = 2 }
status-level = "fail"
success-output = "never"
test-threads = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(postgres_contract) & test(/queue/)'
test-group = 'pg-global-queue'

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "fail"
success-output = "never"
test-threads = "num-cpus"

[profile.full]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
retries = 0
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "slow"
success-output = "never"
test-threads = "num-cpus"
