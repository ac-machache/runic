[package]
name = "runic-skills"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Object-store skill sources, via OpenDAL. Off by default — `cloud` alone gets
# the type plus the `Operator` escape hatch; a per-service flag pulls that
# service's HTTP stack.
cloud = ["dep:opendal"]
s3 = ["cloud", "opendal/services-s3"]
gcs = ["cloud", "opendal/services-gcs"]
azblob = ["cloud", "opendal/services-azblob"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt"] }

runic-tool = { path = "../runic-tool" }
opendal = { workspace = true, optional = true }
runic-macros.workspace = true
schemars.workspace = true

[dev-dependencies]
opendal = { workspace = true, features = ["services-fs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
