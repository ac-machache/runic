[package]
name = "runic-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

runic-state = { path = "../runic-state" }
runic-types = { path = "../runic-types" }
runic-tool = { path = "../runic-tool" }
runic-hook = { path = "../runic-hook" }

opendal = { workspace = true, features = ["services-memory", "services-fs"] }

# Optional Postgres backends (session store + artifact metadata index). Off by
# default so memory/local-fs users don't pull sqlx + a Postgres/TLS stack.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "json", "chrono", "migrate", "macros", "sqlx-toml",
], optional = true }

[features]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
s3 = ["opendal/services-s3"]
gcs = ["opendal/services-gcs"]
azblob = ["opendal/services-azblob"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
