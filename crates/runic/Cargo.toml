[package]
name = "runic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runic-provider = { path = "../runic-provider" }
runic-store = { path = "../runic-store", features = ["postgres", "sqlite"] }
runic-tool = { path = "../runic-tool" }
runic-hook = { path = "../runic-hook" }
runic-skills = { path = "../runic-skills" }
runic-state = { path = "../runic-state" }
runic-types = { path = "../runic-types" }
runic-agent = { path = "../runic-agent" }
runic-mcp = { path = "../runic-mcp" }
runic-transcriber = { path = "../runic-transcriber" }
runic-macros = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
runic-extract = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net"] }
uuid = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
web-extract = ["dep:runic-extract"]
postgres = ["runic-store/postgres"]
anthropic = ["runic-provider/anthropic"]
mistral = ["runic-provider/mistral"]
gemini = ["runic-provider/gemini"]
