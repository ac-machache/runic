[package]
name = "runic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runic-provider = { path = "../runic-provider" }
runic-substrate = { path = "../runic-substrate", features = ["postgres"] }
runic-tool = { path = "../runic-tool" }
runic-hook = { path = "../runic-hook" }
runic-memory = { path = "../runic-memory"}
runic-skills = { path = "../runic-skills" }
runic-state = { path = "../runic-state" }
runic-types = { path = "../runic-types" }
runic-agent = { path = "../runic-agent" }
runic-subagent = { path = "../runic-subagent" }
runic-mcp = { path = "../runic-mcp" }
runic-transcriber = { path = "../runic-transcriber" }
runic-commands = { workspace = true }
runic-macros = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "net"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
anthropic = ["runic-provider/anthropic"]
openai = ["runic-provider/openai"]
mistral = ["runic-provider/mistral"]
gemini = ["runic-provider/gemini"]
