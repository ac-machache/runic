[package]
name = "runic-e2e-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
runic-agent = { path = "../../crates/runic-agent" }
runic-provider = { path = "../../crates/runic-provider", features = ["mistral"] }
runic-tool = { path = "../../crates/runic-tool" }
runic-tools = { path = "../../crates/runic-tools" }
runic-hook = { path = "../../crates/runic-hook" }
runic-state = { path = "../../crates/runic-state" }
runic-subagent = { path = "../../crates/runic-subagent" }
runic-serve = { path = "../../crates/runic-serve" }
runic-substrate = { path = "../../crates/runic-substrate", features = ["postgres"] }
runic-types = { path = "../../crates/runic-types" }

anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
runic-substrate = { path = "../../crates/runic-substrate" }
runic-state = { path = "../../crates/runic-state" }
runic-types = { path = "../../crates/runic-types" }
proptest = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
http-body-util = "0.1"
